name: ClassNet Production Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build-windows-ecosystem:
    runs-on: windows-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances du serveur Intranet
        run: |
          python -m pip install --upgrade pip
          pip install -r intranet-server/requirements.txt
          pip install nuitka zstandard

      - name: ⚡ Compiler le serveur Intranet en binaire autonome (Nuitka)
        run: |
          cd intranet-server
          python -m nuitka --standalone --mingw64 --enable-plugin=anti-bloat --output-dir=dist server_intranet.py

      - name: 🟢 Installer Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: classnet-p/package-lock.json

      - name: 💻 Compiler ClassNet P (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: classnet-p
          configPath: src-tauri/tauri.conf.json

      - name: 📦 Générer l'installateur Global (Inno Setup)
        uses: gautamkrishnar/keepalive-workflow@v1 # Ou action d'appel Inno Setup CLI
        run: |
          echo "Préparation du package d'installation global pour l'école..."
