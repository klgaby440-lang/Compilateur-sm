name: ClassNet Production Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows-ecosystem:
    runs-on: windows-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances du serveur Intranet
        run: |
          python -m pip install --upgrade pip
          pip install -r intranet-server/requirements.txt

      - name: ⚡ Compiler le serveur Intranet avec Nuitka
        run: |
          cd intranet-server
          python -m nuitka --standalone --mingw64 --include-package=fastapi --include-package=uvicorn --include-package=pydantic --output-dir=dist_nuitka server_intranet.py

      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 💻 Compiler ClassNet P (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: classnet-p
          configPath: src-tauri/tauri.conf.json

      - name: 🛠️ Installer Inno Setup pour générer le .exe final
        run: |
          choco install innosetup -y

      - name: 📦 Générer l'installateur Global Inno Setup
        run: |
          iscc installer/classnet_setup.iss

      - name: 🚀 Publier l'artefact de l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: ClassNet-Suite-Setup
          path: installer/ClassNet_Suite_Setup_v1.3.0.exe
