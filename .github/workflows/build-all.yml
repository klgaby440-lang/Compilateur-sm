name: PrimeInk, Class-Ink et serveur intranet — builds Windows séparés

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Serveur Intranet compilé avec Nuitka. L'artefact est un ZIP de
  #    toute la distribution standalone (EXE + bibliothèques nécessaires).
  build-intranet-server:
    name: Compiler le serveur intranet
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: intranet-server/requirements.txt

      - name: Installer les dépendances Python et Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade nuitka zstandard
          python -m pip install -r intranet-server/requirements.txt

      - name: Compiler le serveur Intranet
        shell: pwsh
        run: |
          Set-Location intranet-server
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=pydantic `
            --company-name="CRYPT Enterprise" `
            --product-name="ClassNet Intranet Node" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --output-dir="dist_nuitka" `
            server_intranet.py

          $dist = Join-Path (Get-Location) "dist_nuitka/server_intranet.dist"
          if (-not (Test-Path (Join-Path $dist "server_intranet.exe"))) {
            throw "Compilation Nuitka terminée, mais server_intranet.exe est introuvable dans $dist"
          }

          $zip = Join-Path $env:RUNNER_TEMP "ClassNet-Intranet-Server-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Serveur compilé et empaqueté : $zip"

      - name: Publier l'artefact du serveur (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ClassNet-Intranet-Server-Windows
          path: ${{ runner.temp }}/ClassNet-Intranet-Server-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # 2. PrimeInk / ClassNet P — son propre setup Inno Setup.
  build-primeink:
    name: Générer le setup PrimeInk
    runs-on: windows-latest
    needs: build-intranet-server
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Télécharger le serveur compilé pour le packaging
        uses: actions/download-artifact@v4
        with:
          name: ClassNet-Intranet-Server-Windows
          path: ${{ runner.temp }}/intranet-server-artifact

      - name: Préparer la distribution du serveur dans le dépôt
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "intranet-server/dist_nuitka"
          $expectedBundle = Join-Path $destination "server_intranet.dist"
          $zip = Join-Path $env:RUNNER_TEMP "intranet-server-artifact/ClassNet-Intranet-Server-Windows.zip"
          $staging = Join-Path $env:RUNNER_TEMP "intranet-expanded"
          if (-not (Test-Path $zip)) { throw "Artefact serveur absent : $zip" }
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $staging -Force
          $serverExe = Get-ChildItem -Path $staging -Filter "server_intranet.exe" -Recurse | Select-Object -First 1
          if (-not $serverExe) { throw "server_intranet.exe introuvable dans l'artefact serveur" }
          if (Test-Path $expectedBundle) { Remove-Item $expectedBundle -Recurse -Force }
          New-Item -ItemType Directory -Path $expectedBundle -Force | Out-Null
          Copy-Item -Path (Join-Path $serverExe.DirectoryName "*") -Destination $expectedBundle -Recurse -Force
          if (-not (Test-Path (Join-Path $expectedBundle "server_intranet.exe"))) {
            throw "Impossible de reconstruire la distribution standalone du serveur"
          }

      - name: Installer les dépendances PrimeInk
        shell: pwsh
        run: |
          Set-Location classnet-p
          npm install --no-audit --no-fund

      - name: Compiler PrimeInk avec Tauri (sans créer de Release GitHub)
        shell: pwsh
        run: |
          Set-Location classnet-p
          npx tauri build

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Générer le setup PrimeInk
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "installer/Output"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }
          if (-not (Test-Path "installer/classnet_p_setup.iss")) { throw "Script installer/classnet_p_setup.iss introuvable" }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          & $iscc "/O$outDir" "/FPrimeInk_Setup_v1.3.0" "installer/classnet_p_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation Inno Setup pour PrimeInk (code $LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $outDir "PrimeInk_Setup_v1.3.0.exe"))) { throw "Setup PrimeInk non généré" }

      - name: Publier le setup PrimeInk
        uses: actions/upload-artifact@v4
        with:
          name: PrimeInk-Setup-Windows
          path: installer/Output/PrimeInk_Setup_v1.3.0.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # 3. Class-Ink / ClassNet App — son propre setup Inno Setup.
  build-classink:
    name: Générer le setup Class-Ink
    runs-on: windows-latest
    needs: build-intranet-server
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Télécharger le serveur compilé pour le packaging
        uses: actions/download-artifact@v4
        with:
          name: ClassNet-Intranet-Server-Windows
          path: ${{ runner.temp }}/intranet-server-artifact

      - name: Préparer la distribution du serveur dans le dépôt
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "intranet-server/dist_nuitka"
          $expectedBundle = Join-Path $destination "server_intranet.dist"
          $zip = Join-Path $env:RUNNER_TEMP "intranet-server-artifact/ClassNet-Intranet-Server-Windows.zip"
          $staging = Join-Path $env:RUNNER_TEMP "intranet-expanded"
          if (-not (Test-Path $zip)) { throw "Artefact serveur absent : $zip" }
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $staging -Force
          $serverExe = Get-ChildItem -Path $staging -Filter "server_intranet.exe" -Recurse | Select-Object -First 1
          if (-not $serverExe) { throw "server_intranet.exe introuvable dans l'artefact serveur" }
          if (Test-Path $expectedBundle) { Remove-Item $expectedBundle -Recurse -Force }
          New-Item -ItemType Directory -Path $expectedBundle -Force | Out-Null
          Copy-Item -Path (Join-Path $serverExe.DirectoryName "*") -Destination $expectedBundle -Recurse -Force
          if (-not (Test-Path (Join-Path $expectedBundle "server_intranet.exe"))) {
            throw "Impossible de reconstruire la distribution standalone du serveur"
          }

      - name: Installer les dépendances Class-Ink
        shell: pwsh
        run: |
          Set-Location classnet-app
          npm install --no-audit --no-fund

      - name: Compiler Class-Ink avec Tauri (sans créer de Release GitHub)
        shell: pwsh
        run: |
          Set-Location classnet-app
          npx tauri build

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Générer le setup Class-Ink
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "installer/Output"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }
          if (-not (Test-Path "installer/classnet_app_setup.iss")) { throw "Script installer/classnet_app_setup.iss introuvable" }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          & $iscc "/O$outDir" "/FClassInk_Setup_v1.3.0" "installer/classnet_app_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation Inno Setup pour Class-Ink (code $LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $outDir "ClassInk_Setup_v1.3.0.exe"))) { throw "Setup Class-Ink non généré" }

      - name: Publier le setup Class-Ink
        uses: actions/upload-artifact@v4
        with:
          name: Class-Ink-Setup-Windows
          path: installer/Output/ClassInk_Setup_v1.3.0.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
