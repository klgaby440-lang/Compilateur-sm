name: ClassNet — builds Windows indépendants en parallèle

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # JOB 1 — L'archive distribuable du serveur intranet.
  # Ce job ne dépend d'aucun autre job.
  build-intranet-server:
    name: Compiler le serveur intranet (artefact 1/3)
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intranet-server/requirements.txt

      - name: Installer les dépendances Python et Nuitka
        shell: pwsh
        run: |
          if (-not (Test-Path "intranet-server/requirements.txt")) {
            throw "Fichier intranet-server/requirements.txt introuvable."
          }
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Échec de mise à niveau de pip." }
          python -m pip install --upgrade nuitka zstandard
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation de Nuitka." }
          python -m pip install -r intranet-server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation des dépendances du serveur." }

      - name: Compiler le serveur avec Nuitka
        shell: pwsh
        run: |
          Set-Location intranet-server
          if (-not (Test-Path "server_intranet.py")) {
            throw "Fichier intranet-server/server_intranet.py introuvable."
          }
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=pydantic `
            --company-name="CRYPT Enterprise" `
            --product-name="ClassNet Intranet Node" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --output-dir="dist_nuitka" `
            server_intranet.py
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation Nuitka (code $LASTEXITCODE)." }

          $dist = Join-Path (Get-Location) "dist_nuitka/server_intranet.dist"
          if (-not (Test-Path (Join-Path $dist "server_intranet.exe"))) {
            throw "server_intranet.exe est introuvable dans $dist"
          }
          $zip = Join-Path $env:RUNNER_TEMP "ClassNet-Intranet-Server-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "L'archive du serveur n'a pas été créée." }

      - name: Publier l'artefact serveur (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ClassNet-Intranet-Server-Windows
          path: ${{ runner.temp }}/ClassNet-Intranet-Server-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # JOB 2 — PrimeInk. Il est autonome et démarre en parallèle du job serveur.
  # La distribution Nuitka est recompilée dans ce job parce que le script Inno
  # Setup de PrimeInk peut inclure intranet-server/dist_nuitka/server_intranet.dist.
  build-primeink:
    name: Compiler et empaqueter PrimeInk (artefact 2/3)
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intranet-server/requirements.txt

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compiler la distribution locale du serveur pour le setup PrimeInk
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Échec de mise à niveau de pip." }
          python -m pip install --upgrade nuitka zstandard
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation de Nuitka." }
          python -m pip install -r intranet-server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation des dépendances du serveur." }
          Set-Location intranet-server
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=pydantic `
            --company-name="CRYPT Enterprise" `
            --product-name="ClassNet Intranet Node" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --output-dir="dist_nuitka" `
            server_intranet.py
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation du serveur requis par le setup PrimeInk." }
          $serverExe = Join-Path (Get-Location) "dist_nuitka/server_intranet.dist/server_intranet.exe"
          if (-not (Test-Path $serverExe)) { throw "Distribution du serveur manquante : $serverExe" }

      - name: Installer les dépendances PrimeInk
        shell: pwsh
        run: |
          Set-Location classnet-p
          if (-not (Test-Path "package.json")) { throw "classnet-p/package.json introuvable." }
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation des dépendances PrimeInk." }

      - name: Compiler PrimeInk avec Tauri
        shell: pwsh
        run: |
          Set-Location classnet-p
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation Tauri pour PrimeInk." }

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Générer l'installateur PrimeInk
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "installer/Output"
          $iss = "installer/classnet_p_setup.iss"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }
          if (-not (Test-Path $iss)) { throw "Script Inno Setup introuvable : $iss" }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          & $iscc "/O$outDir" "/FPrimeInk_Setup_v1.3.0" $iss
          if ($LASTEXITCODE -ne 0) { throw "Échec Inno Setup PrimeInk (code $LASTEXITCODE)." }
          if (-not (Test-Path (Join-Path $outDir "PrimeInk_Setup_v1.3.0.exe"))) {
            throw "PrimeInk_Setup_v1.3.0.exe n'a pas été généré."
          }

      - name: Publier l'artefact PrimeInk
        uses: actions/upload-artifact@v4
        with:
          name: PrimeInk-Setup-Windows
          path: installer/Output/PrimeInk_Setup_v1.3.0.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # JOB 3 — Class-Ink. Il est autonome et démarre en parallèle des deux autres.
  # Le serveur est recompilé ici pour que le setup puisse inclure sa distribution
  # sans attendre l'artefact produit par le job 1.
  build-classink:
    name: Compiler et empaqueter Class-Ink (artefact 3/3)
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intranet-server/requirements.txt

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compiler la distribution locale du serveur pour le setup Class-Ink
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Échec de mise à niveau de pip." }
          python -m pip install --upgrade nuitka zstandard
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation de Nuitka." }
          python -m pip install -r intranet-server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation des dépendances du serveur." }
          Set-Location intranet-server
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=pydantic `
            --company-name="CRYPT Enterprise" `
            --product-name="ClassNet Intranet Node" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --output-dir="dist_nuitka" `
            server_intranet.py
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation du serveur requis par le setup Class-Ink." }
          $serverExe = Join-Path (Get-Location) "dist_nuitka/server_intranet.dist/server_intranet.exe"
          if (-not (Test-Path $serverExe)) { throw "Distribution du serveur manquante : $serverExe" }

      - name: Installer les dépendances Class-Ink
        shell: pwsh
        run: |
          Set-Location classnet-app
          if (-not (Test-Path "package.json")) { throw "classnet-app/package.json introuvable." }
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Échec d'installation des dépendances Class-Ink." }

      - name: Compiler Class-Ink avec Tauri
        shell: pwsh
        run: |
          Set-Location classnet-app
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "Échec de compilation Tauri pour Class-Ink." }

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Générer l'installateur Class-Ink
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "installer/Output"
          $iss = "installer/classnet_app_setup.iss"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }
          if (-not (Test-Path $iss)) { throw "Script Inno Setup introuvable : $iss" }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          & $iscc "/O$outDir" "/FClassInk_Setup_v1.3.0" $iss
          if ($LASTEXITCODE -ne 0) { throw "Échec Inno Setup Class-Ink (code $LASTEXITCODE)." }
          if (-not (Test-Path (Join-Path $outDir "ClassInk_Setup_v1.3.0.exe"))) {
            throw "ClassInk_Setup_v1.3.0.exe n'a pas été généré."
          }

      - name: Publier l'artefact Class-Ink
        uses: actions/upload-artifact@v4
        with:
          name: Class-Ink-Setup-Windows
          path: installer/Output/ClassInk_Setup_v1.3.0.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
