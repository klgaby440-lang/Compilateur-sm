name: ClassNet Master Production Ecosystem Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-full-ecosystem:
    runs-on: windows-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      # =========================================================
      # 1. CONFIGURATION DES ENVIRONNEMENTS (Sans cache obsolète)
      # =========================================================
      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟢 Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🦀 Configurer la chaîne de compilation Rust
        uses: dtolnay/rust-toolchain@stable
        
      # =========================================================
      # 3. COMPILATION DU SERVEUR INTRANET (NUITKA STABLE)
      # =========================================================
      - name: 📦 Installation des dépendances sans cache
        run: |
          python -m pip install --no-cache-dir --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir --upgrade nuitka zstandard
          python -m pip install --no-cache-dir -r intranet-server/requirements.txt
        shell: powershell

      - name: ⚡ Compiler le serveur Intranet avec Nuitka
        run: |
          cd intranet-server
          python -m nuitka --standalone `
            --assume-yes-for-downloads `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=pydantic `
            --company-name="CRYPT Enterprise" `
            --product-name="ClassNet Intranet Node" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --output-dir="dist_nuitka" server_intranet.py
        shell: powershell

# =========================================================
      # 4. COMPILATION CLASSNET P (DESKTOP TAURI ADMIN)
      # =========================================================
      - name: 📦 Installer les dépendances ClassNet P
        run: |
          cd classnet-p
          npm install
        shell: powershell

      - name: 💻 Compiler ClassNet P (Tauri Administration)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: classnet-p

      # =========================================================
      # 5. COMPILATION CLASSNET APP (DESKTOP TAURI ENSEIGNANT)
      # =========================================================
      - name: 📦 Installer les dépendances ClassNet App
        run: |
          cd classnet-app
          npm install
        shell: powershell

      - name: 📱 Compiler ClassNet App (Tauri Enseignant)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: classnet-app

      # =========================================================
      # 6. PACKAGING GLOBAL (INNO SETUP)
      # =========================================================
      - name: 🛠️ Installer Inno Setup
        run: |
          choco install innosetup -y
        shell: powershell

      - name: 📦 Générer l'installateur Windows ClassNet (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/classnet_setup.iss
        shell: powershell

      - name: 🚀 Publier l'installateur Windows Desktop Final
        uses: actions/upload-artifact@v4
        with:
          name: ClassNet-Suite-Setup-Windows
          path: installer/Output/ClassNet_Suite_Setup_v1.3.0.exe
